<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Family Account — Everlasting Paws | Pet Cremation & Memorial</title>
  <meta name="description" content="Register your Everlasting Paws family account to receive real-time care updates, customize commemorative keepsakes, and cherish your pet's memorial tribute.">

  <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Core CSS & Responsive CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="shortcut icon" href="assets/images/favicon.svg">
</head>
<body>

  <!-- Page Preloader -->
  <div class="page-preloader" id="pagePreloader" aria-hidden="true">
    <div class="preloader-content">
      <div class="preloader-icon-wrap">
        <svg class="preloader-paw" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C6.5 2 2 6.5 2 12c0 3.5 1.8 6.6 4.6 8.4.4.3.9.4 1.4.3l3.5-.8c.3-.1.6-.1.9 0l3.5.8c.5.1 1 0 1.4-.3C20.2 18.6 22 15.5 22 12c0-5.5-4.5-10-10-10z"/>
          <path d="M9 11a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z" fill="currentColor"/>
          <path d="M15 11a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z" fill="currentColor"/>
          <path d="M12 16a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" fill="currentColor"/>
        </svg>
        <div class="preloader-ring"></div>
      </div>
      <div class="preloader-text">Everlasting<span>Paws</span></div>
      <div class="preloader-line"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <main class="auth-split-layout auth-reverse">
    
    <!-- LEFT PANE: Modern Compassionate Registration Form -->
    <div class="auth-form-pane">
      <div class="auth-form-card">
        
        <span class="auth-kicker">— NEW FAMILY REGISTRATION</span>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join our family portal to receive live care updates, customize keepsakes, and create lasting tributes.</p>

        <form onsubmit="event.preventDefault(); showToast('🕊️ Account created successfully! Welcome to Everlasting Paws.'); setTimeout(() => window.location.href='index.html', 1400);">
          
          <!-- Full Name -->
          <div class="form-group" style="margin-bottom: 16px;">
            <label for="regName">FULL NAME</label>
            <input type="text" id="regName" class="form-control" placeholder="Enter your full name" required autocomplete="name">
          </div>

          <!-- Email Address -->
          <div class="form-group" style="margin-bottom: 16px;">
            <label for="regEmail">EMAIL ADDRESS</label>
            <input type="email" id="regEmail" class="form-control" placeholder="name@domain.com" required autocomplete="email">
          </div>

          <!-- Phone Number -->
          <div class="form-group" style="margin-bottom: 16px;">
            <label for="regPhone">PHONE NUMBER</label>
            <input type="tel" id="regPhone" class="form-control" placeholder="(555) 000-0000" required autocomplete="tel">
          </div>

          <!-- Password with Toggle -->
          <div class="form-group" style="margin-bottom: 16px;">
            <label for="regPassword">PASSWORD</label>
            <div class="auth-input-wrap">
              <input type="password" id="regPassword" class="form-control" placeholder="Create a secure password (8+ chars)" required minlength="8" autocomplete="new-password">
              <button type="button" class="password-toggle-btn" data-action="toggle-password" data-target="regPassword" title="Show or hide password" aria-label="Toggle password visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Terms Agreement -->
          <div class="auth-meta-row" style="margin-bottom: 22px;">
            <label class="auth-checkbox-label" style="align-items:flex-start; line-height:1.4;">
              <input type="checkbox" id="agreeTerms" required style="margin-top:2px;">
              <span>I agree to the <a href="#" onclick="event.preventDefault(); showToast('🕊️ Terms of Care: Guaranteed individual dignity & strict tracking.');" class="auth-link">Terms of Care</a> &amp; <a href="#" onclick="event.preventDefault(); showToast('🕊️ Privacy: Your family records are strictly confidential.');" class="auth-link">Privacy Policy</a></span>
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary auth-submit-btn">CREATE FAMILY ACCOUNT</button>

          <!-- Switch to Login -->
          <p class="auth-switch-text">
            Already have an account? <a href="login.html" class="auth-link">Sign in</a>
          </p>

          <div style="text-align:center; margin-top:28px;">
            <a href="index.html" class="auth-link" style="font-size:0.86rem; color:var(--text-muted); display:inline-flex; align-items:center; gap:6px;">
              <span>← Return to Home</span>
            </a>
          </div>

        </form>

      </div>
    </div>

    <!-- RIGHT PANE: Visual Editorial Banner -->
    <div class="auth-visual-pane" style="background-image: url('assets/images/service-communal-garden.jpg');">
      <div class="auth-visual-overlay"></div>

      <!-- Top Overlay Controls -->
      <header class="auth-visual-header">
        <a href="index.html" class="brand-logo" aria-label="Everlasting Paws Home">
          <div class="brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2C6.5 2 2 6.5 2 12c0 3.5 1.8 6.6 4.6 8.4.4.3.9.4 1.4.3l3.5-.8c.3-.1.6-.1.9 0l3.5.8c.5.1 1 0 1.4-.3C20.2 18.6 22 15.5 22 12c0-5.5-4.5-10-10-10z"/>
              <path d="M9 11a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/>
              <path d="M15 11a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/>
              <path d="M12 16a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
            </svg>
          </div>
          <div class="brand-text">Everlasting<span>Paws</span></div>
        </a>

        <div class="auth-visual-controls">
          <!-- Theme Toggle -->
          <button type="button" class="auth-ctrl-btn theme-toggle" title="Toggle dark mode" aria-label="Toggle Theme">
            <svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>

          <!-- RTL Direction Toggle -->
          <button type="button" class="auth-ctrl-btn rtl-pill rtl-toggle" title="Toggle RTL layout" aria-label="Toggle text direction">
            RTL
          </button>
        </div>
      </header>

      <!-- Bottom Headline -->
      <div class="auth-visual-footer">
        <span class="auth-kicker">— A PEACEFUL PROMISE</span>
        <h2>Gentle guidance,<br>supportive care at every step.</h2>
      </div>
    </div>

  </main>

  <!-- JavaScript Bundle -->
  <script src="assets/js/main.js"></script>
</body>
</html>
